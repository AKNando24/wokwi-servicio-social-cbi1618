; Módulo 9.2: proyecto PlatformIO para Arduino Uno (se simula con Wokwi para VS Code)
; Servicio Social CBI-1618 - Pérez Sánchez Fernando Alberto
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
; La biblioteca propia vive en lib/EstacionLib y PlatformIO la detecta sola.
